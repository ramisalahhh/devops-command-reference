name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:            # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write                  # allowed to publish to Pages
  id-token: write               # used to verify the deployment

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Check the page exists and has content
        run: |
          test -s site/index.html
          grep -q "<title>DevOps Command Reference</title>" site/index.html

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload the site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
